schema: spec-driven-review

# Project context — shown to AI when creating any artifact.
context: |
  # What the app is
  Ctrl+List — wishlist / gift-list sharing. Three-state visibility
  (private | unlisted | public). Owners build lists; followers
  bookmark, visit, and claim items with spoiler hiding.

  # Stack
  Next.js App Router · React 19 · TS · NextAuth (Google) · Drizzle on
  Neon Postgres · vanilla CSS with tokens. No Tailwind, no CSS-in-JS.

  # DB driver constraint — no transactions
  DB connection uses `drizzle-orm/neon-http` (Neon HTTP API). Interactive
  transactions, `db.transaction(...)`, and `SELECT … FOR UPDATE` are
  unavailable — every query is its own HTTP round-trip. Cross-statement
  atomicity must be backstopped at the DB layer (unique indexes, partial
  unique indexes, `ON CONFLICT`) or accepted as residual. Do not propose
  switching to neon-serverless / WebSocket Pool without owner approval.

  # Where things live (pointers — verify by ls, don't trust this map)
  - App-wide UI primitives under `app/ui/components/<family>/`
  - Page-scoped UI under `app/(main)/<area>/ui/`
  - CSS tokens in `app/ui/styles/global.css`
  - Data layer in `lib/data/`: per-domain module pairs — reads in
    `<domain>.ts`, server actions in `<domain>.actions.ts` (domains:
    user, list, listItems, visit, item, purchase) plus internal
    non-endpoint modules (`item.schema.ts`, `item.associations.ts`,
    `user.session.ts`). See `openspec/specs/data-layer-organization`.
  - Drizzle schema in `db/schema.ts`

  # Read-first docs
  Before writing artifacts that touch these areas, read the repo doc
  that owns the rules: tests -> `TESTING.md` (assertion bar, forbidden
  patterns, naming); DB/schema/migrations -> `DATABASE.md` (driver
  limits, migration workflow); everything else -> `CLAUDE.md` (hard
  rules digest, file-size bands, comment and abstraction policy).

  # Spec authority
  Active specs in `openspec/specs/<capability>/spec.md` are the
  authoritative normative contract. Archived changes under
  `openspec/changes/archive/` are historical; their requirements were
  rolled into the active spec at archive time. A behavior may be
  governed by a different capability than the DOM region it affects
  (e.g., Follow-button placement is owned by `following`, not by any
  list-hero capability) — treat the active spec as binding regardless
  of folder.

  # Cross-cutting design systems
  Every interactive surface (button, link, chip, input, textarea,
  select, checkbox, menu, popover trigger, segmented control) is
  governed by a primitive-family spec under `openspec/specs/` or an
  in-flight change under `openspec/changes/`. Do not propose
  page-scoped one-off classes for these surfaces — extend the
  primitive via a spec modification instead.

  # Data freshness
  `lib/data/*.ts` reads use `'use cache'` + `cacheTag(...)`. Mutations
  must call `updateTag(...)` for matching tags or reads go stale.

  # Meta: this file is a WIP
  If during any OpenSpec workflow (explore, propose, design, apply)
  anything in this file seems off, stale, or a missing pointer would
  have saved a wrong turn, surface it and suggest editing this file —
  the orientation here is iterated, not fixed.

# Per-artifact rules — enforced during artifact creation.
rules:
  proposal:
    - |
      Before drafting, enumerate active specs (`openspec list --specs
      --json` or `ls openspec/specs`) and grep EVERY active spec.md
      for any DOM class, component name, file path, or behavior the
      change will touch — not just the capability folder name. Cite
      any binding SHALLs found as inherited constraints in "Why".
    - |
      If the change touches an interactive surface listed under
      cross-cutting design systems, cite the relevant primitive spec
      and explain how the change flows through existing primitives.
      Adding a new variant, size, or sibling primitive is a spec
      modification — include a MODIFIED Capabilities entry. Page-
      scoped className overrides on primitive classes are not an
      acceptable workaround.
    - |
      If the change adds or modifies a server-side read, name the
      cache tag it consumes and every mutation path that must
      revalidate that tag.
  design:
    - |
      For each Decision, check whether an active spec governs the
      region. If yes, align with it or scope a separate change to
      modify it — do not silently override. Keep rejected decisions
      in the doc with rationale so the constraint isn't re-discovered.
  specs:
    - |
      The `/mattpocock-skills:grilling` interview must have concluded
      against the reviewed proposal before specs are drafted. Do not
      draft specs or any later artifact until it has.
    - |
      When adding a requirement that overlaps semantically with one
      in another capability, name the overlap and defer. Cross-
      capability constraints belong in the capability that owns the
      behavior, not the one that owns the DOM region.
    - |
      A delta that introduces a NEW capability MUST state the
      capability's Purpose (1-3 sentences, derived from the
      proposal's Why and the delta's requirements) so sync/archive
      writes that Purpose into the created main spec instead of the
      generated workflow's default TBD stub. Never leave a new
      capability's Purpose as TBD.
  tasks:
    - |
      Every tasks.md MUST include a pre-merge verification section
      (conventionally the final numbered section, e.g. "## N. Pre-
      merge") with explicit, separately-checkable tasks for ALL FIVE
      of the following gates passing clean:
        - `npm run lint` (eslint — zero errors, zero warnings)
        - `npx tsc --noEmit` (typescript — zero errors)
        - `npm run build` (next build — completes successfully,
          including type-check and production bundle)
        - `npm run test:coverage` (vitest — zero failing tests, with
          coverage reporting)
        - `npm run test:e2e` (playwright — zero failing tests)
      These are not optional and not collapsible into a single
      "validate" checkbox — each gate gets its own task so partial
      failure is visible in the checklist. The `build` gate exists in
      addition to `tsc --noEmit` because Next.js' production build
      surfaces issues (route-level type errors, server/client boundary
      violations, missing env at build time, RSC serialization) that
      `tsc --noEmit` alone does not catch. The `test:e2e` gate is
      author-run locally and ALSO re-run by CI per-PR (a fork-safe
      Postgres-sidecar job runs the Playwright suite against the same
      docker-compose + seed-as-fixture path — see the `testing-foundation`
      capability and ci.yml).

      These gates are run by the author locally before requesting
      review, against the author's real `.env.local`; CI re-runs all
      five (lint/tsc/build/test:coverage, plus the e2e suite per-PR) for
      defense in depth. Tasks should record local-run results; do not
      annotate them with CI-environment caveats (e.g. placeholder env
      vars, missing secrets) — those belong in ci.yml, not in the
      change record.

      Doc-only exemption: when every file in a change's diff is one
      that cannot affect test outcomes — markdown docs, `.claude/**`
      skills/commands, `openspec/**`, and comment-only edits to any
      other file — the `test:coverage` and `test:e2e` gate tasks MAY
      be omitted instead of run, never silently: an exempt gate
      carries no checklist item (a never-run gate is not a checkable
      task), and the section's lead-in names the omitted gates and the
      "doc-only change" rationale. Any executable change voids the exemption however
      small, including one to a file whose other edits qualify. The
      test is what the diff can affect, not which directory it sits
      in: a reworded comment in `ci.yml` qualifies, a changed step in
      it does not. CI on the dev push still runs the full battery, so
      defense in depth is preserved.
  review:
    - |
      Emit the review.md scaffold VERBATIM from the artifact template — the
      review-family machine-readable header with `round: 0` and empty/`TBD`
      `anchor` and `diff-source`, and no round sections. Do NOT invent findings,
      rounds, verdicts, or scope. The real review is produced later by the
      multi-agent `/spec-review` skill, which APPENDS round 1 into this file and
      fills the header; propose-time generation only guarantees the file exists
      so a fix session auto-loads it from `/opsx:apply`'s contextFiles.
