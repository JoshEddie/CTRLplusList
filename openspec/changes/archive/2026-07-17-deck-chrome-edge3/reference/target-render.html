<!--
  TOKEN-RESOLVED TARGET RENDER — what implementation.md produces in the APP palette.
  Colors are the app tokens' resolved values (--primary-color #7324ce, --success-text #059669, ...),
  NOT the mock's off-brand hex. This is the fidelity target: the mock's look, in our design system.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --primary-color:#7324ce; --neutral-text-color:#1f2937; --muted-text-color:#6b7280;
    --neutral-border-color:#d1d5db; --light-color:#fff; --success-text:#059669;
    --card-border-color:#ebebf5; --deck-well-bg:#f6f5fb; --primary-color-light:#cda2ff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#141033; display:flex; justify-content:center; align-items:center;
         min-height:100vh; padding:40px 16px; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }

  .deck-screen { position:relative; width:380px; height:620px; display:flex; flex-direction:column;
    overflow:hidden; background:var(--light-color); border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,.4); }
  .deck-screen-hd { flex:none; padding:20px 22px 18px; }
  .deck-screen-eyebrow { color:var(--primary-color); font-weight:700; letter-spacing:.06em; font-size:14px; text-transform:uppercase; }
  .deck-screen-title { margin-top:11px; font-size:27px; line-height:1.1; font-weight:700; color:var(--neutral-text-color); }
  .deck-screen-sub { margin-top:8px; font-size:14px; line-height:1.4; color:var(--muted-text-color); }

  .deck-screen-close { position:absolute; top:16px; right:16px; width:32px; height:32px; display:flex;
    align-items:center; justify-content:center; border-radius:50%; background:rgba(255,255,255,.92);
    border:1px solid rgba(0,0,0,.07); color:var(--muted-text-color); box-shadow:0 1px 4px rgba(0,0,0,.14);
    z-index:4; cursor:pointer; }

  .deck-screen-well { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable;
    padding:6px 22px 22px;
    background:
      radial-gradient(farthest-side at 50% 100%, rgba(30,17,72,.14), transparent) bottom / 100% 10px no-repeat,
      var(--deck-well-bg); }

  .fld-label { display:block; font-weight:700; color:var(--neutral-text-color); font-size:14px; margin-bottom:7px; }
  .fld { background:var(--light-color); border:1px solid var(--neutral-border-color); border-radius:10px; padding:11px 13px; }
  .fld textarea { width:100%; border:none; outline:none; resize:none; font:inherit; font-size:15px; color:var(--neutral-text-color); line-height:1.4; }
  .counter { text-align:right; font-weight:700; font-size:13px; margin-top:7px; }
  .counter.err { color:#dc2626; } .counter.ok { color:var(--muted-text-color); }
  .err-banner { display:flex; gap:9px; align-items:flex-start; background:#fde8e8; border-radius:10px; padding:12px 14px; margin-top:10px; }
  .err-banner span { color:#b91c1c; font-size:14px; line-height:1.35; }
  .trim { display:flex; gap:14px; align-items:center; width:100%; text-align:left; background:var(--light-color);
    border:1px dashed var(--primary-color-light); border-radius:10px; padding:12px 16px; margin-top:14px; cursor:pointer; }
  .trim .k { color:var(--primary-color); font-weight:700; letter-spacing:.04em; font-size:12px; flex:none; }
  .trim .v { color:var(--neutral-text-color); font-weight:700; font-size:15px; line-height:1.3; }
  .fld-hint { color:var(--muted-text-color); font-size:13px; line-height:1.4; margin:22px 0 7px; }

  .deck-screen-ft { flex:none; padding:16px 22px 18px; background:var(--light-color);
    border-top:1px solid var(--card-border-color); box-shadow:0 -6px 14px -8px rgba(30,17,72,.35); }
  .deck-steps { display:flex; align-items:flex-start; margin-bottom:14px; }
  .deck-step { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; padding:0; }
  .deck-step-track { flex:1; height:2px; margin-top:11px; }
  .deck-step-node { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; background:var(--light-color); }
  .deck-step-label { font-size:9px; }
  .deck-step[data-status=done] { cursor:pointer; }
  .deck-step[data-status=done] .deck-step-node { background:var(--success-text); color:var(--light-color); }
  .deck-step[data-status=done] .deck-step-label { color:var(--success-text); font-weight:700; }
  .deck-step[data-status=current] .deck-step-node { border:2px solid var(--primary-color); color:var(--primary-color); }
  .deck-step[data-status=current] .deck-step-label { color:var(--primary-color); font-weight:700; }
  .deck-step[data-status=future] .deck-step-node { border:1px solid var(--neutral-border-color); color:var(--muted-text-color); }
  .deck-step[data-status=future] .deck-step-label { color:var(--muted-text-color); font-weight:500; }
  .deck-step-track[data-into=done] { background:var(--success-text); }
  .deck-step-track[data-into=current] { background:var(--primary-color); }
  .deck-step-track[data-into=future] { background:var(--neutral-border-color); }
  .continue { width:100%; display:flex; gap:10px; align-items:center; justify-content:center; padding:14px;
    background:var(--primary-color); border:none; border-radius:12px; font:inherit; font-weight:700; font-size:17px; color:#fff; cursor:pointer; }
  svg { display:block; }
</style>
</head>
<body>
  <div class="deck-screen">
    <button class="deck-screen-close" aria-label="Close">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div class="deck-screen-hd">
      <span class="deck-screen-eyebrow">Add an Item</span>
      <h2 class="deck-screen-title">Give it a clear name</h2>
      <p class="deck-screen-sub">Scraped names carry junk. Tighten it so it's easy to read.</p>
    </div>
    <div class="deck-screen-well">
      <label class="fld-label">Item name</label>
      <div class="fld"><textarea rows="2">Mock Ultra-Premium Professional-Grade Stainless Steel Twelve-Piece Cookware Set</textarea></div>
      <p class="counter err">158/100</p>
      <div class="err-banner">
        <svg width="18" height="18" fill="#dc2626" viewBox="0 0 512 512" style="flex:none;margin-top:1px;"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zm0-384c13.3 0 24 10.7 24 24l0 112c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-112c0-13.3 10.7-24 24-24zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/></svg>
        <span>That's over the 100-character limit — trim it before saving.</span>
      </div>
      <button class="trim"><span class="k">TAP TO USE</span><span class="v">Mock Ultra-Premium Professional-Grade Stainless</span></button>
      <label class="fld-label" style="margin-top:22px;">Description</label>
      <p class="fld-hint" style="margin-top:0;">Move size, color, or variant details here.</p>
      <div class="fld"><textarea rows="2" placeholder="Short and specific — a size, color, or detail."></textarea></div>
      <p class="counter ok">0/100</p>
    </div>
    <div class="deck-screen-ft">
      <div class="deck-steps" role="group" aria-label="Progress">
        <button class="deck-step" data-status="done" aria-label="Go back to The Note">
          <span class="deck-step-node"><svg width="11" height="11" fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          <span class="deck-step-label">Note</span>
        </button>
        <span class="deck-step-track" data-into="done"></span>
        <button class="deck-step" data-status="done" aria-label="Go back to The Photo">
          <span class="deck-step-node"><svg width="11" height="11" fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          <span class="deck-step-label">Photo</span>
        </button>
        <span class="deck-step-track" data-into="current"></span>
        <div class="deck-step" data-status="current" aria-current="step">
          <span class="deck-step-node">3</span><span class="deck-step-label">Name</span>
        </div>
        <span class="deck-step-track" data-into="future"></span>
        <div class="deck-step" data-status="future" aria-disabled="true">
          <span class="deck-step-node">4</span><span class="deck-step-label">Price</span>
        </div>
      </div>
      <button class="continue">Continue
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
