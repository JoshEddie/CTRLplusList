<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div style="min-height:100vh;background:#141033;display:flex;justify-content:center;align-items:center;padding:40px 16px;font-family:'Roboto Condensed',system-ui,sans-serif;">
  <div style="width:380px;height:620px;background:#fff;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.4);">
    <div style="flex:none;padding:20px 22px 18px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="color:#6d28d9;font-weight:700;letter-spacing:.06em;font-size:14px;text-transform:uppercase;">Add an Item</span>
        <button style="width:32px;height:32px;border-radius:99px;background:#fff;border:1.5px solid #e5e7eb;box-shadow:0 2px 8px rgba(30,17,72,.14);display:flex;align-items:center;justify-content:center;color:#6b7280;cursor:pointer;flex:none;" aria-label="Close">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
      </div>
      <h2 style="font-size:27px;line-height:1.1;color:#111827;font-weight:700;margin-top:11px;">Give it a clear name</h2>
      <p style="color:#6b7280;font-size:14px;line-height:1.4;margin-top:8px;">Scraped names carry junk. Tighten it so it's easy to read.</p>
    </div>
    <div style="flex:1;overflow-y:auto;background:#f6f5fb;padding:6px 22px 22px;">
      <label style="display:block;font-weight:700;color:#1f2937;font-size:14px;margin-bottom:7px;">Item name</label>
      <div style="background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:11px 13px;">
        <textarea rows="2" style="width:100%;border:none;outline:none;resize:none;font-family:'Roboto',sans-serif;font-size:15px;color:#1f2937;line-height:1.4;">Mock Ultra-Premium Professional-Grade Stainless Steel Twelve-Piece Cookware Set</textarea>
      </div>
      <p style="text-align:right;color:#dc2626;font-weight:700;font-size:13px;margin-top:7px;">158/100</p>
      <div style="display:flex;gap:9px;align-items:flex-start;background:#fde8e8;border-radius:10px;padding:12px 14px;margin-top:10px;">
        <svg width="18" height="18" fill="#dc2626" viewBox="0 0 512 512" style="flex:none;margin-top:1px;"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zm0-384c13.3 0 24 10.7 24 24l0 112c0 13.3-10.7 24-24 24s-24-10.7-24-24l0-112c0-13.3 10.7-24 24-24zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"></path></svg>
        <span style="color:#b91c1c;font-size:14px;line-height:1.35;">That's over the 100-character limit — trim it before saving.</span>
      </div>
      <button style="display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:1px dashed #b8a6f0;border-radius:10px;padding:12px 16px;margin-top:14px;cursor:pointer;">
        <span style="color:#6d28d9;font-weight:700;letter-spacing:.04em;font-size:12px;flex:none;">TAP TO USE</span>
        <span style="color:#1f2937;font-weight:700;font-size:15px;line-height:1.3;">Mock Ultra-Premium Professional-Grade Stainless</span>
      </button>
      <label style="display:block;font-weight:700;color:#1f2937;font-size:14px;margin:22px 0 4px;">Description</label>
      <p style="color:#6b7280;font-size:13px;line-height:1.4;margin-bottom:7px;">Move size, color, or variant details here.</p>
      <div style="background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:11px 13px;">
        <textarea rows="2" placeholder="Short and specific — a size, color, or detail." style="width:100%;border:none;outline:none;resize:none;font-family:'Roboto',sans-serif;font-size:15px;color:#1f2937;line-height:1.4;"></textarea>
      </div>
      <p style="text-align:right;color:#9ca3af;font-weight:700;font-size:13px;margin-top:7px;">0/100</p>
    </div>
    <div style="flex:none;background:#fff;border-top:1px solid #ece9f6;padding:16px 22px 18px;box-shadow:0 -6px 14px -8px rgba(30,17,72,.35);">
      <div style="display:flex;align-items:flex-start;margin-bottom:14px;">
        <button aria-label="Go back to The Note" style="background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;">
          <span style="width:22px;height:22px;border-radius:99px;background:#15803d;display:flex;align-items:center;justify-content:center;">
            <svg width="11" height="11" fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
          <span style="font-size:9px;color:#15803d;font-weight:700;">Note</span>
        </button>
        <div style="flex:1;height:2px;background:#15803d;margin-top:11px;"></div>
        <button aria-label="Go back to The Photo" style="background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;">
          <span style="width:22px;height:22px;border-radius:99px;background:#15803d;display:flex;align-items:center;justify-content:center;">
            <svg width="11" height="11" fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
          <span style="font-size:9px;color:#15803d;font-weight:700;">Photo</span>
        </button>
        <div style="flex:1;height:2px;background:#6d28d9;margin-top:11px;"></div>
        <div aria-current="step" style="display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;">
          <div style="width:22px;height:22px;border-radius:99px;background:#fff;border:2px solid #6d28d9;display:flex;align-items:center;justify-content:center;color:#6d28d9;font-size:11px;font-weight:700;">3</div>
          <span style="font-size:9px;color:#6d28d9;font-weight:700;">Name</span>
        </div>
        <div style="flex:1;height:2px;background:#e5e0f5;margin-top:11px;"></div>
        <div aria-disabled="true" style="display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;cursor:not-allowed;">
          <div style="width:22px;height:22px;border-radius:99px;background:#fff;border:2px solid #d9d5e8;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:11px;font-weight:700;">4</div>
          <span style="font-size:9px;color:#9ca3af;font-weight:500;">Price</span>
        </div>
      </div>
      <button style="width:100%;display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;background:#6d28d9;border:none;border-radius:12px;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:17px;color:#fff;cursor:pointer;">
        Continue
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>
  </div>
</div>
