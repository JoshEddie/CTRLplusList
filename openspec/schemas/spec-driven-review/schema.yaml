name: spec-driven-review
version: 1
description: spec-driven + a propose-time review.md scaffold artifact (repo fork)
# PROJECT-LOCAL FORK of the package @fission-ai/openspec `spec-driven` schema,
# renamed so it is distinct (no name-shadowing) and the package default stays
# reachable. Changes select it via `schema: spec-driven-review` in config.yaml
# (default for new changes) and each change's `.openspec.yaml`.
# The proposal/specs/design/tasks artifacts + apply block below are a verbatim
# copy of the package schema; `adr`, `acceptance` and `review` are the local
# additions (see the acceptance-artifact and review-artifact capabilities; the
# adr artifact's decisions are recorded in the archived adr-artifact change).
# They are NOT all appended at the end — `adr` is declared between `proposal`
# and `specs` for the reason stated at its declaration. Reconcile against the
# package `spec-driven` schema on `openspec update` — see CLAUDE.md,
# trunk-workflow.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in.
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: `openspec validate` rejects a
      change with zero deltas unless the change's `.openspec.yaml` sets
      `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  # LOCAL ADDITION. Declared HERE, between `proposal` and `specs`: the position
  # is load-bearing. `/embark-design` loops `/opsx:continue` until `design.md`
  # exists and continue walks declaration order, so an artifact declared after
  # `design` is never generated at design time — silently, since `status` reads
  # `ready` forever and nothing errors. Before `specs` also keeps upstream's
  # `proposal < specs < design < tasks` order intact. Do not move it to the end.
  - id: adr
    generates: adr.md
    description: Architectural decisions this change makes, as a library delta
    template: adr.md
    instruction: |
      Record the architectural decisions this change makes, as a delta against
      the ADR library at `openspec/adr/`. Entries are promoted by hand into
      `openspec/adr/` at landing.

      An ADR is a decision that outlives this change and binds later work.

      A decision earns an entry when BOTH hold:
      - It LASTS - an ADR binds until it is removed or superseded. A choice
        binding only this change stays in design.md; a rule that exists only to
        carry a temporary state - a migration, a transition, a deprecation
        window - ends when that state ends and is not an ADR however many
        changes it binds on the way
      - The channel already firing at its trigger carries the rule WITHOUT its
        reasoning. A lint error states a threshold and never the argument behind
        it, so the decision behind it earns an entry. A PROSE channel - an
        artifact instruction, a skill - carries its reasoning implicitly by
        nature, whether or not a sentence spells the argument out, so a rule
        living there earns no entry on the grounds that its why is only implied.
        Drift risk and DRY outrank stating the why: one home for a rule beats a
        complete argument split across two

      CLAUDE.md vs ADR is decided by READ FREQUENCY, not content type. CLAUDE.md
      is auto-fed every session, so its scarce resource is rows: a rule needed in
      EVERY session belongs there, a decision needed only sometimes belongs in an
      ADR. One topic legitimately appears in both - the rule in CLAUDE.md, the
      argument behind it in an ADR. That split is the narrow exception CLAUDE.md's
      row scarcity earns, because the why genuinely cannot fit there; it is not
      available wherever the why is merely thin.

      This file scaffolds EMPTY. Three headings and no entries is the record that
      the change made no architectural decision, not an incomplete artifact. Do
      not invent one to fill it.

      Delta operations (use ## headers):
      - **ADDED ADRs**: new decisions, body inline
      - **MODIFIED ADRs**: changed decisions - MUST include the ENTIRE updated
        entry, **Touching** included; partial content loses detail at promotion
      - **REMOVED ADRs**: decisions that no longer bind - MUST give the resulting
        stub (which form, and the replacement's ID where there is one) plus
        **Reason**, which stays in the delta and does not go into the stub

      Format requirements:
      - Each entry: `### ADR-NNNN: <title>` followed by **Touching**, **Context**
        (<= 3 sentences), **Decision** (<= 5), **Consequences** (<= 3)
      - Over cap means two decisions - split the entry, never trim a load-bearing
        fact
      - A rejected alternative is a name plus one clause; its argument stays in
        design.md
      - Take the next unused NNNN from `openspec/adr/INDEX.md`

      **Touching** IS the index row's left cell - the index is derived from it and
      nothing is authored at index level. Take EVERY term the entry binds, not
      only the central one: a wasted read costs seconds, a missed one ships work
      against a decision its reader never saw. If no term fits, do NOT force the
      nearest - a near-miss term is a silent miss, and the reader whose work this
      binds never matches it. Propose the new term in this delta for review to
      promote to the bank alongside the entry.

      Proposing a bank term:
      - Only where the entry binds work no existing term names. Rewording or
        splitting a term that already covers the work changes the vocabulary every
        other entry is keyed on, and is not part of writing an entry
      - Name a SURFACE by default, an ACTION only where the action is the trigger
        and no artifact is being edited (`Running Tests`) - a surface term covers
        authoring and editing alike, so `Skills & Agents` beats `Writing a Skill`
      - A term must DISCRIMINATE: one nearly every task matches is not a key. A
        parameterized family (`Editing <capability> spec`), instance bound in the
        entry's own cell, narrows a trigger that would otherwise fire on
        everything
      - Growth runs through review, never the author alone - a bank admitting a
        term per entry degrades into free prose with extra steps

      ADRs are living documents, edited IN PLACE - not immutable-with-supersede.
      Superseded text sitting in an agent's context is token waste and a rot risk:
      an agent reading 100k of context can lose that the first 25k was retracted.
      git holds the history.

      A removed decision is GUTTED, not deleted. Its file stays at
      `openspec/adr/NNNN-kebab-title.md` and keeps its title; the whole body is
      replaced by one line - `**Superseded** - see ADR-NNNN: <title>`, or
      `**Removed** - this rule no longer applies; do not follow older references
      to it.` What rots is a superseded BODY in an agent's context, and the body
      is exactly what goes. The stub answers what a deleted file cannot: an ADR
      number cited in a commit, a comment, a skill, or another ADR resolves to a
      redirect instead of nothing. A stub carries no **Touching** line, so it
      drops out of the index while its file remains, and numbers are never reused.
    requires:
      - proposal

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by a concise description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `openspec/specs/<capability-path>/spec.md` directly.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability-path>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)
      5. If possible edit the requirement description to be concise

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      Good design docs concisely explain the "why" behind technical decisions.
    requires:
      - adr

  - id: acceptance
    generates: acceptance.md
    description: Chained Given/When/Then user-journey acceptance flows
    template: acceptance.md
    instruction: |
      Draft user-journey acceptance flows by chaining the change's touched
      `#### Scenario:` blocks together with pre-existing links found in
      canonical `openspec/specs/**/spec.md` — grep the corpus, same discipline
      as rules.proposal.

      Not a summary: every row is sourced. A step the corpus cannot back is
      surfaced as a finding, never written around on the flow's own authority.
      The failure types a finding is classified under are named once, in
      `/embark-qualify`'s SKILL.md; this instruction states only that an
      unsourceable step is surfaced.

      While any finding stands, the run writes no flows and no
      `acceptance.md`. That is a property of the artifact rather than of the
      gate, so it holds on every generation route and not only under
      `/embark-qualify` — a half-chained file reads as a completed walk.

      design.md never sources behavior — a step chains on a spec scenario or
      not at all. Where a spec backs the step but names no observable, design.md
      may supply the concrete surface the row asserts (the handle, not the
      behavior); that is not a finding. Where design.md is the only thing
      asserting the behavior itself, or asserts behavior a spec denies, the
      step is not sourced: surface it.

      Format: one Given→When→Then arc per flow, stages in strict order
      of appearance — a stage recurring after a later one (When after
      Then, Given after When) starts a new flow. One atom per row: one
      concrete action by the chain's ROOT ACTOR carrying that actor's
      literal handle — "clicks `Claim as Guest`", "runs `npm run
      db:migrate`", "POSTs to the action" — or a single observable
      assertion; `And` continues the current stage.

      The root actor must produce a TESTABLE outcome — an exit code,
      stdout, rows in a table. An agent following a skill's instructions
      does not: `WHEN this skill runs, THEN this happens` is a list of
      instructions, and no test attaches to it.

      A Then asserts what the execution emitted — rendered page, HTTP
      response, database state, command stdout or exit code, a generated
      file. The state of hand-written source MAY be a Given and SHALL
      NEVER be a When or a Then. The discriminator is subject matter, not
      verb, so rewording `WHEN the source is inspected` into `WHEN a
      maintainer runs rg` does not launder it.

      Givens open on the binary distinguishing state, no `And` restating
      what's implied. Thens state implied negatives explicitly; no
      parenthetical commentary, no unobservable claims. Convert vague
      prose to a concrete observable ("reads as theirs" → "the banner
      reads `You`"); none findable = surface it. Canonical spec scenarios
      stay WHEN/THEN; GWT is exclusive to acceptance.md.

      Lifecycle: this planning-time draft is later refined at apply time with
      literal handles (real button text, real routes) — refine, not rewrite;
      flow identity and journey scope stay as drafted.

      No test-plan content: no scenario→test-layer mapping, no coverage
      claims. Flows are walk scripts for the owner's pre-landfall walk and
      /port-inspection's map-wide e2e scout, nothing more.
    requires:
      - specs

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)

      Example:
      ```
      ## 1. Setup

      - [ ] 1.1 Create new module structure
      - [ ] 1.2 Add dependencies to package.json

      ## 2. Core Implementation

      - [ ] 2.1 Implement data export function
      - [ ] 2.2 Add CSV formatting utilities
      ```

      Reference specs for what needs to be built, design for how to build it.
      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design

  - id: review
    generates: review.md
    description: Persisted spec-review report, scaffolded at propose time
    template: review.md
    instruction: |
      Emit the review.md scaffold VERBATIM from the template — the review-family
      machine-readable header with `round: 0` and empty/`TBD` `anchor` and
      `diff-source`, and no round sections.

      Do NOT invent findings, rounds, verdicts, or scope. This artifact is a
      placeholder: the real review content is produced later by the multi-agent
      `/spec-review` skill, which APPENDS round 1 into this file and fills the
      header. Generation here only guarantees the file exists so a fix session
      auto-loads it from `/opsx:apply`'s contextFiles. See `rules.review` in
      openspec/config.yaml and the review-artifact capability.
    requires:
      - tasks

apply:
  requires: [tasks, review, acceptance]
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    acceptance.md is the end-state picture the implementation works toward:
    as concrete surfaces land, refine its flows with literal handles (real
    button text, real routes) — refine, not rewrite.
    Pause if you hit blockers or need clarification.
